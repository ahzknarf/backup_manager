version: 1

databases:
  - type: sqlite
    source: data/db.sqlite3
    snapshot: backups/db.sqlite3
    method: vacuum
  - type: sqlite
    source: data/task.sqlite3
    snapshot: backups/task.sqlite3
    method: vacuum
restore:
  policy: if_missing
git:
  enabled: true
  remote: origin
  branch: master
  message: 'backup: linkding'
  paths:
    - docker-compose.yaml
deploy:
  enabled: true
  compose_file: docker-compose.yaml
