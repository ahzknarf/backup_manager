version: 1

databases:
  - type: sqlite
    source: data/memos_prod.db
    snapshot: backups/memos_prod.db
    method: vacuum
    timeout_seconds: 300
    restore_mode: '0600'

restore:
  policy: if_missing

git:
  enabled: true
  scope: paths # Set to all to commit all non-ignored repository changes.
  remote: origin
  branch: master
  message: 'backup: memos'
  paths:
    - docker-compose.yaml

deploy:
  enabled: true
  compose_file: docker-compose.yaml
