name: Publish backup launcher

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash -n service.sh
      - run: python scripts/release.py manifest --check
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build commit-pinned release
        env:
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          python scripts/release.py pages
          --base-url "$PUBLIC_URL"
          --repository "$GITHUB_REPOSITORY"
          --revision "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
